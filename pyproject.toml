[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-radar-au"
version = "0.2.0"
description = "Commonwealth tax legislation corpus builder and the provenance-first change-review queue that consumes it"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "tax", "legislation", "provenance", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
]
[project.urls]
Homepage = "https://github.com/ryanduguid/au-tax-legislation-corpus"
Repository = "https://github.com/ryanduguid/au-tax-legislation-corpus.git"
Issues = "https://github.com/ryanduguid/au-tax-legislation-corpus/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14", "build>=1.2", "pytest>=8"]

[project.scripts]
tax-radar-au = "tax_radar_au.cli:main"

[tool.setuptools]
# The distribution name stays tax-radar-au: nothing consumes it on PyPI, and
# the wheel, CLI and existing release assets keep their identity. fadden joins
# it so `python -m fadden` resolves after `pip install -e .` instead of only
# from inside the clone. Its stage data (manifest_md.json, the title lists)
# stays out: the builder reads and writes beside its own modules in a checkout.
packages = ["tax_radar_au", "fadden"]
include-package-data = false

[tool.setuptools.package-data]
tax_radar_au = ["samples/*/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["tax_radar_au", "fadden", "tools", "tests"]

[tool.ruff.lint]
# Whole-repository set: import layout (E4, I), statement-level mistakes (E7),
# syntax errors (E9) and the full pyflakes set (F).
# Keep Decimal("10.00") money literals; E501 stays off, so long emitted-format
# string literals in the corpus stages are untouched.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
packages = ["tax_radar_au", "fadden"]
ignore_missing_imports = true
pretty = true

# The live-evidence exporter's official-output transaction is Windows-only and
# reaches it through ctypes.WinDLL and msvcrt. Those names do not exist on the
# platform mypy assumes in CI (ubuntu), so every use reports attr-defined.
# Only that error code is disabled, and only for this module: its other checks,
# and every check in the rest of fadden, still run. Replacing the ctypes
# traversal is a separate, security-adjacent change.
[[tool.mypy.overrides]]
module = "fadden.export_live_evidence_bundles"
disable_error_code = ["attr-defined"]
