[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-radar-au"
version = "0.3.0"
description = "Commonwealth tax legislation corpus builder and the provenance-first change-review queue that consumes it"
readme = "README.md"
requires-python = ">=3.14"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "tax", "legislation", "provenance", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
]
[project.urls]
Homepage = "https://github.com/ryanduguid/au-tax-legislation-corpus"
Repository = "https://github.com/ryanduguid/au-tax-legislation-corpus.git"
Issues = "https://github.com/ryanduguid/au-tax-legislation-corpus/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14", "build>=1.2", "pytest>=8", "coverage==7.16.2"]

[tool.setuptools]
# The distribution name stays tax-radar-au: nothing consumes it on PyPI, and
# the wheel and existing release assets keep their identity. The review queue
# and its tax-radar-au command are the Rust binary built by Cargo.toml; the
# wheel carries the corpus builder, so `python -m fadden` resolves after
# `pip install -e .` instead of only from inside the clone. Its stage data
# (manifest_md.json, the title lists) stays out: the builder reads and writes
# beside its own modules in a checkout.
packages = ["fadden"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Dump every thread's traceback when one test runs past 5 minutes (the slowest
# takes about 40 s), so a hang names its test long before CI's 30-minute job
# timeout kills the run with no clue (#218's Ubuntu jobs on 20 October 2026).
faulthandler_timeout = 300

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["fadden", "tools", "tests"]

[tool.ruff.lint]
# Whole-repository set: import layout (E4, I), statement-level mistakes (E7),
# syntax errors (E9) and the full pyflakes set (F).
# Keep Decimal("10.00") money literals; E501 stays off, so long emitted-format
# string literals in the corpus stages are untouched.
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
# C tracing records exception-unwinding paths that sysmon misses in the failure tests.
core = "ctrace"

[tool.coverage.report]
# The ubuntu coverage leg cannot run the Windows-only live-evidence publication
# transaction (ctypes.WinDLL, msvcrt), so the floor sits below 100. Those 182
# lines (181 before the UTF-16 name-length fix) predate the Rust port; moving
# stages to the Rust fadden binary removed about 2,500 covered Python
# statements, which lowered the total from 97% to 94%. Removing discover,
# versions, extract and finalize took out 926 more, leaving 92.07%.
fail_under = 92
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.14"
packages = ["fadden"]
ignore_missing_imports = true
pretty = true

# The live-evidence exporter's official-output transaction is Windows-only and
# reaches it through ctypes.WinDLL and msvcrt. Those names do not exist on the
# platform mypy assumes in CI (ubuntu), so every use reports attr-defined.
# Only that error code is disabled, and only for this module: its other checks,
# and every check in the rest of fadden, still run. Replacing the ctypes
# traversal is a separate, security-adjacent change.
[[tool.mypy.overrides]]
module = "fadden.export_live_evidence_bundles"
disable_error_code = ["attr-defined"]
