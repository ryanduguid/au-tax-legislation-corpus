name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        tests: ["tests"]
        include:
          - os: windows-latest
            python: "3.12"   # where path handling can diverge
            # The corpus half has never run on Windows: before the merge its
            # only CI was the ubuntu-only verify workflow. It fails 15 tests
            # there on 8.3 short paths (RUNNER~1 against runneradmin), NTFS
            # junctions and reparse points. All pre-existing, none the radar's.
            # Windows covers the radar half until someone fixes them.
            tests: "tests/radar"
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      # No -q here: pyproject's addopts already sets it, and a second -q makes
      # it -qq, which drops the pass/fail count from the log. Without the count
      # a test file that stops being collected leaves every leg green.
      - run: uv run --locked --extra dev pytest ${{ matrix.tests }}
        env:
          UV_PYTHON: ${{ matrix.python }}

  package:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev --python 3.12 python -m build
      # The sample fixtures ship as package data; a wheel that cannot find
      # them reintroduces the install-root bug where a plain 'pip install'
      # produced a CLI that could never locate its own demo inputs.
      - name: install the wheel and run the demo from outside the checkout
        run: |
          python -m venv /tmp/venv
          # --no-index, or pip is free to resolve the name from PyPI and
          # test a release nobody built in this job.
          /tmp/venv/bin/pip install --no-index --find-links dist tax-radar-au
          cd /tmp
          resolve() { /tmp/venv/bin/python -c "from tax_radar_au.util import sample_path; print(sample_path('$1', '$2'))"; }
          /tmp/venv/bin/tax-radar-au compare \
            --baseline "$(resolve baseline sample-sources.json)" \
            --observation "$(resolve observations sample-register-observation.json)" \
            --map "$(resolve mappings sample-source-skill-map.json)" \
            --out demo
          /tmp/venv/bin/tax-radar-au validate-review \
            --queue demo/impact-queue.json \
            --decision "$(resolve decisions sample-technical-review.json)" \
            --out demo/validation.json

  lint:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev ruff check tax_radar_au tests
      - run: uv run --locked --extra dev mypy tax_radar_au
