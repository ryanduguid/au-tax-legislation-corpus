name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI follows Python 3.15 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.15"

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.14", "3.15"]
        tests: ["tests"]
        include:
          - os: windows-latest
            python: "3.14"   # where path handling can diverge
            # The corpus half has never run on Windows: before the merge its
            # only CI was the ubuntu-only verify workflow. It fails 15 tests
            # there on 8.3 short paths (RUNNER~1 against runneradmin), NTFS
            # junctions and reparse points. All pre-existing, none the radar's.
            # Keep other corpus modules excluded; exercise the supported
            # Windows-only live-evidence export boundary as well as radar.
            tests: "tests/radar tests/corpus/test_live_evidence_bundle_export.py tests/corpus/test_live_evidence_publication_paths.py"
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true
      # No -q here: pyproject's addopts already sets it, and a second -q makes
      # it -qq, which drops the pass/fail count from the log. Without the count
      # a test file that stops being collected leaves every leg green.
      - if: matrix.os == 'ubuntu-latest' && matrix.python != '3.14'
        run: uv run --locked --extra dev pytest ${{ matrix.tests }}
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: run tests with whole-package branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked --extra dev coverage run --branch --source=tax_radar_au,fadden -m pytest tests  # NOSONAR: the environment is synced from uv.lock, whose dependencies install from wheels
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: write whole-package coverage for Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked --extra dev coverage xml -o coverage-codecov.xml  # NOSONAR: the environment is synced from uv.lock, whose dependencies install from wheels
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1
      # After the upload, so Codecov still receives a report that misses the floor.
      - name: hold whole-package coverage at the configured floor
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked --extra dev coverage report  # NOSONAR: the environment is synced from uv.lock, whose dependencies install from wheels
        env:
          UV_PYTHON: ${{ matrix.python }}
      # The Windows leg runs a subset, so it writes its report without the
      # whole-package floor. Codecov merges it with the ubuntu report, which
      # cannot run the Windows-only live-evidence publication transaction.
      - name: run the Windows tests with branch coverage
        if: matrix.os == 'windows-latest'
        run: uv run --locked --extra dev coverage run --branch --source=tax_radar_au,fadden -m pytest ${{ matrix.tests }}  # NOSONAR: the environment is synced from uv.lock, whose dependencies install from wheels
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: write Windows coverage for Codecov
        if: matrix.os == 'windows-latest'
        run: uv run --locked --extra dev coverage xml --fail-under=0 -o coverage-windows.xml  # NOSONAR: the environment is synced from uv.lock, whose dependencies install from wheels
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: keep the Windows coverage report for the Codecov upload
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage-windows.xml
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from tests-gates: a Codecov outage must
  # not block merges.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-windows
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml,coverage-windows.xml
          disable_search: true
          fail_ci_if_error: true

  package:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv run --locked --extra dev --python 3.14 python -m build  # NOSONAR: unprivileged job; uv installs the hash-locked set
      # The sample fixtures ship as package data; a wheel that cannot find
      # them reintroduces the install-root bug where a plain 'pip install'
      # produced a CLI that could never locate its own demo inputs.
      - name: install the wheel and run the demo from outside the checkout
        run: |
          python -m venv /tmp/venv
          # The wheel file and --no-index, or pip is free to resolve the name
          # from PyPI and test a release nobody built in this job.
          /tmp/venv/bin/pip install --no-index dist/tax_radar_au-*.whl
          cd /tmp
          resolve() { /tmp/venv/bin/python -c "from tax_radar_au.util import sample_path; print(sample_path('$1', '$2'))"; }
          /tmp/venv/bin/tax-radar-au compare \
            --baseline "$(resolve baseline sample-sources.json)" \
            --observation "$(resolve observations sample-register-observation.json)" \
            --map "$(resolve mappings sample-source-skill-map.json)" \
            --out demo
          /tmp/venv/bin/tax-radar-au validate-review \
            --queue demo/impact-queue.json \
            --decision "$(resolve decisions sample-technical-review.json)" \
            --out demo/validation.json

  lint:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true
      # Both cover the whole repository: fadden is 8,402 lines that neither
      # tool used to see. Paths and packages come from pyproject, so there is
      # one list to keep in step rather than two.
      - run: uv run --locked --extra dev ruff check .  # NOSONAR: unprivileged job; uv installs the hash-locked set
      - run: uv run --locked --extra dev mypy  # NOSONAR: unprivileged job; uv installs the hash-locked set
      # The lockfile pins 19 packages that ship in the release archive family;
      # nothing checked them against advisories until now.
      - run: uv audit --locked --no-config --python-version 3.14

  tests-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [test, package, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml tests-gates --exempt codecov
