name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-archive.yml@47480b782926179b621ec1c6643ef88c80fc8fd4 # release-policy history was rewritten; re-pinned to the equivalent commit (adds CI job timeouts, #9)
    with:
      artifact-stem: au-tax-legislation-corpus-builder
