name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # No timeout-minutes here, unlike the sibling workflows. A job that calls a
    # reusable workflow with `uses` accepts only name, uses, with, secrets,
    # needs, if, permissions, strategy and concurrency; timeout-minutes on this
    # job fails workflow validation and would break every release. The bound
    # lives where the work does: all three jobs in the pinned release-policy
    # workflow, checks, consumer-tests and the publish-archives call it needs,
    # set timeout-minutes: 15, the same cap verify.yml uses.
    permissions:
      actions: read # Read this repository's own runs to require the mandatory checks.
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-archive.yml@87767ec809dc7f77bcd45808219adaf67841ae7b # source-archive construction owner
    with:
      # Every mandatory check a push to main actually reports, which the policy
      # requires to have succeeded for the exact release commit before anything
      # is built. Each line names one job exactly as GitHub records it, taken
      # from real push runs rather than from the workflow source: the gate
      # fails closed on an empty list and refuses a name matching more than one
      # job. Neither ci.yml nor codeql.yml carries a path filter, and the only
      # if: is codeql-gates' always(), which runs its check rather than skipping
      # it, so nothing listed here can be skipped into a pass.
      #
      # publish-live-evidence.yml is absent deliberately: it is
      # workflow_dispatch only, so requiring it would block every release.
      required-checks: |
        .github/workflows/no-ai-attribution.yml: Attribution policy / Attribution policy runner
        .github/workflows/ci.yml: lint
        .github/workflows/ci.yml: package
        .github/workflows/ci.yml: test (ubuntu-latest, 3.10, tests)
        .github/workflows/ci.yml: test (ubuntu-latest, 3.11, tests)
        .github/workflows/ci.yml: test (ubuntu-latest, 3.12, tests)
        .github/workflows/ci.yml: test (ubuntu-latest, 3.13, tests)
        .github/workflows/ci.yml: test (ubuntu-latest, 3.14, tests)
        .github/workflows/ci.yml: test (windows-latest, 3.12, tests/radar tests/corpus/test_live_evidence_bundle_export.py)
        .github/workflows/ci.yml: tests-gates
        .github/workflows/codeql.yml: Analyze (actions)
        .github/workflows/codeql.yml: Analyze (python)
        .github/workflows/codeql.yml: codeql-gates
      artifact-stem: au-tax-legislation-corpus-builder
