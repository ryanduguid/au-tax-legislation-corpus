name: Fuzzing

# A 60-second random exploration is not a repeatable merge gate, so it runs
# after merge, weekly and on demand rather than on pull requests, and no gate
# requires it. tests/corpus/test_fuzz_harness.py replays the seed corpus in
# the unit tests.
on:
  push:
    branches: [main]
  schedule:
    - cron: "59 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: fuzz the privacy patterns
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned fuzzer
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement fuzz/requirements-fuzz.txt
      - name: Fuzz the patterns
        run: >-
          python -m fuzz.privacy_patterns fuzz/corpus
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024
