# This workflow is ready for the repository to move from CodeQL default setup
# to advanced setup. Default setup blocks result uploads from repository-owned
# workflows. Before merging this workflow under a clean-check policy, switch
# to advanced setup and revalidate this exact pull-request head.
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: matrix.language != 'python'
        uses: github/codeql-action/init@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          build-mode: none
          languages: ${{ matrix.language }}

      # This non-mergeable probe keeps the default queries and adds GitHub's
      # security-extended suite only for Python. That suite contains default
      # queries plus additional lower-precision coverage.
      - name: Initialize CodeQL with extended Python queries
        if: matrix.language == 'python'
        uses: github/codeql-action/init@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          build-mode: none
          languages: ${{ matrix.language }}
          config: |
            queries:
              - uses: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
