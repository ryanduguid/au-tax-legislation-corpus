[package]
name = "tax-radar-au"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Provenance-first AU tax change-review queue over the staged legislation corpus"
license = "Apache-2.0"
repository = "https://github.com/ryanduguid/au-tax-legislation-corpus"
publish = false

[lib]
name = "tax_radar_au"

[[bin]]
name = "tax-radar-au"
path = "src/main.rs"

[[bin]]
name = "fadden"
path = "src/fadden_main.rs"

[dependencies]
getrandom = "0.3"
num-bigint = "0.4.8"
regex = "1.13.1"
sha2 = "0.11.1"
unicode-normalization = "0.1.25"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
